刃接续","支撑实际建立、维持或释放","立刃后马上抓住雪，整个弯都踩得住，换刃时下个刃接得上"],["建立滞后","建立滞后：有效支撑在新刃角出现之后才确认建立（例：滞后约0.3秒），之后持续","支撑实际建立、维持或释放","立刃后约{实测}秒才抓住雪，之后一直踩得住"],["中断后接回","中断后接回：控制阶段确认支撑中断，随后重新接回（例：中段1次）","有效支撑中断","{弯中／弯尾}刃抓不住雪松脱了{实测}次，随后重新抓住"]],"离雪":[["保持接触","保持接触：全段保持接触，没有离雪","—","雪板全程贴着雪面，没有离雪"],["离雪再接触","离雪再接触：起伏处或主动动作后离雪，再接触后继续滑行（例：离雪约0.2秒）","已确认离雪及再接触","雪板离开雪面约{实测}秒，落回后继续滑"],["双脚腾空候选","双脚腾空候选：两脚加速度同时＜0.7g连续≥0.08秒，且随后0.32秒内任一脚出现≥2g的落地峰；只能看到滞空约0.1秒以上的，是否完全离雪未确认","已确认离雪及再接触（候选）","{入弯／弯中／弯尾}两只脚同时变轻约{实测}秒（最低约{实测}g和{实测}g），之前蹬压约{实测}g、之后落地冲击约{实测}g，像是双脚腾空，是否完全离雪未确认"],["板头翘起","板头翘起：换刃（双脚Roll均值过零）后0.4秒内，前脚俯仰（扣掉立刃耦合、相对整趟均值）多翘≥20度，且比同一刻后脚多≥7度；说明板头相对板尾抬起，前脚是否离雪未确认","—（目录暂无对应现象）","本弯结束换刃后约{实测}秒板头翘起：前脚比平时多翘约{实测}度、比后脚多约{实测}度，这一刻前脚约{实测}g、后脚约{实测}g，前脚是否离雪未确认"],["未见候选","未见候选：没有出现上面两种候选","—","没有发现双脚腾空或板头翘起的迹象（滞空短于约0.1秒的看不到）"]],"俯仰":[["贴近雪面","贴近雪面：雪板纵向姿态贴近雪面，没有明显俯仰","—","板头和板尾都贴着雪面，没有翘起"],["短时俯仰","短时俯仰：经过起伏时板长轴短时上仰或下俯，随后恢复","雪板纵向姿态发生俯仰","过起伏时板头短暂{翘起／下扎}，随后恢复"],["长时偏移","长时偏移：纵向姿态长时间偏向上仰或下俯","雪板纵向姿态发生俯仰","板头长时间{翘起／下扎}，持续约{实测}秒"]],"振动":[["少","少：有效区间内振动和冲击都少","—","雪板滑得安静，抖动和冲击都很少"],["振动增强","振动增强：某段板上测点振动增强，抓雪与支撑没有反复变化（例：弯后段明显多于前段）","板上测点振动增加","{入弯／弯中／弯尾}雪板抖动变多，但刃一直抓着雪"],["连续冲击","连续冲击：出现可分辨的连续短促冲击（例：同一弧段4次、间隔约0.1秒）","连续短促冲击","{入弯／弯中／弯尾}雪板连续顿了{实测}下，间隔约{实测}秒"],["chatter候选","chatter候选：反复振动并伴随接触变化，符合chatter候选（写阶段，例：弯尾）","类似chatter的反复抖动候选","{入弯／弯中／弯尾}雪板反复抖动、刃一下抓一下松，疑似抖刃（chatter）"]],"弯曲":[["渐进弯曲与恢复","渐进弯曲与恢复：弯内板体弯曲逐渐增加，出弯阶段逐渐恢复","板体弯曲逐渐增加、板体形变逐渐恢复","弯中雪板逐渐被压弯，出弯时逐渐弹回"],["快速恢复","快速恢复：弯内板体弯曲逐渐增加，转换附近在短时窗内快速恢复（例：约0.1秒）","板体弯曲逐渐增加、板体形变快速恢复","弯中雪板逐渐被压弯，换刃时约{实测}秒内一下弹回"],["只有局部应变","只有局部应变：只记录到某测点局部应变变化（弯中幅值增大、出弯回落），整板弯曲与恢复未确认","板材局部伸缩幅度增加、板材局部伸缩幅度减小","只测到雪板局部有形变（弯中变大、出弯回落），整块雪板弯了多少还不能确认"]],"路段":[["无固定位置","无固定位置：振动或冲击没有固定位置","—","抖动和冲击没有固定出现在某个位置"],["固定路段","固定路段：多次经过同一路段都出现类似振动或冲击（写位置），与弯向无关","同一路段重复出现类似反应","每次滑到雪道同一段都会抖动或顿一下，共{实测}次，前后刃弯都一样"]],"两侧":[["接近","接近：两侧承重过程、分脚分配与时序、承重相对板动作的时差、支撑和振动都接近","—","前后刃弯的压力和抓雪情况差不多"],["承重过程不同","承重过程不同：两侧承重量、峰值位置或变化过程不同（例：后刃弯后段出现局部突增，前刃弯承重较连续）","前后刃承重过程不同","前后刃压力变化不一样：前刃弯{逐渐加压／突然加压／忽大忽小}，后刃弯{逐渐加压／突然加压／忽大忽小}"],["分脚分配不同","分脚分配不同：同一有效传力方向上两侧的前后脚分配不同（例：前刃后段后脚约占60%，后刃后段约75%）","前后刃分脚承重分配不同","前后刃两个脚的压力分配不一样：前刃弯后脚约占{实测}%，后刃弯后脚约占{实测}%"],["分脚时序不同","分脚时序不同：两侧两脚建立、释放的先后或重叠区间不同（例：前刃转换两脚接近同时建立，后刃前脚先建立、后脚随后）","前后刃分脚承重时序不同","前后刃两个脚{加压／松压}的先后不一样：前刃弯{两个脚同时／前脚先／后脚先}，后刃弯{两个脚同时／前脚先／后脚先}"],["承重与板动作时差不同","承重与板动作时差不同：两侧载荷建立或释放相对板事件的时差不同（例：退出后刃时载荷释放晚于旧刃减角约0.20秒，退出前刃约0.05秒）","前后刃承重相对板动作的时差不同","前后刃压力和立刃的配合不一样：离开前刃时松压比放平晚约{实测}秒，离开后刃时晚约{实测}秒"],["支撑过程不同","支撑过程不同：两侧支撑的建立、维持、中断或接回不同（例：后刃某阶段确认支撑中断，前刃同阶段保持支撑）","前后刃接触与支撑过程不同","前后刃抓雪不一样：前刃弯{一直抓得住／立刃后才慢慢抓住／中途松脱}，后刃弯{一直抓得住／立刃后才慢慢抓住／中途松脱}"],["振动与冲击不同","振动与冲击不同：两侧振动、冲击所在阶段或幅度不同（例：后刃弧尾有重复冲击，前刃相应阶段较少）","前后刃振动与冲击不同","前后刃抖动不一样：前刃弯{入弯／弯中／弯尾}抖了{实测}下，后刃弯{入弯／弯中／弯尾}抖了{实测}下"]],"上半弧":[["前脚更多","前脚更多：上半弧（滚落线前）两脚载荷按时间累加，前脚占比超过52%","上半弧偏向前脚","上半弧前脚压得更多，前脚约占{实测}%"],["两脚均匀","两脚均匀：上半弧（滚落线前）前脚占比在48%–52%之间","—","上半弧两个脚压得差不多，前脚约占{实测}%"],["后脚更多","后脚更多：上半弧（滚落线前）两脚载荷按时间累加，后脚占比超过52%","上半弧偏向后脚","上半弧后脚压得更多，后脚约占{实测}%"]],"下半弧":[["前脚更多","前脚更多：下半弧（滚落线后）两脚载荷按时间累加，前脚占比超过52%","下半弧偏向前脚","下半弧前脚压得更多，前脚约占{实测}%"],["两脚均匀","两脚均匀：下半弧（滚落线后）前脚占比在48%–52%之间","—","下半弧两个脚压得差不多，前脚约占{实测}%"],["后脚更多","后脚更多：下半弧（滚落线后）两脚载荷按时间累加，后脚占比超过52%","下半弧偏向后脚","下半弧后脚压得更多，后脚约占{实测}%"]]}},{"name":"旋转与转向","head":"5. 旋转与转向（5句，14个现象）","sents":[["板向",["板向"],"【板向】。"],["转板",["分布","转速"],"【分布】；【转速】。"],["板端",["外摆","侧移"],"【外摆】；【侧移】。"],["身体旋转",["旋转"],"【旋转】。（暂不能识别）"],["两侧",["两侧"],"【两侧】。"]],"vals":{"板向":[["板向领先","板向领先：板向先转、实际滑向随后跟进，两者保持可分辨的夹角（写夹角与阶段，例：搓雪中板先转向横坡，路径随后跟进）","板的朝向先变、实际滑向后变","板头先转过去，滑行方向随后才跟上，{入弯／弯中／弯尾}两者夹角约{实测}度"],["同步","同步：板向与实际滑向接近同时改变，夹角在描述带内","板的朝向与实际滑向接近同时改变","板头指向哪，雪板就往哪走，板头方向和滑行方向一起转"]],"分布":[["持续渐进","持续渐进：转板在整个弧段持续渐进，没有集中突变","—","整个弯都在均匀地转板，没有哪一段突然猛转"],["集中但圆顺","集中但圆顺：转板集中在某一段（例：后段），轨迹仍圆顺","—","转板集中在{入弯／弯中／弯尾}，轨迹仍然圆顺"],["集中并急变","集中并急变：转板集中在某一段，同一时窗轨迹急变（例：弧尾板向快速横转，轨迹出现局部急折）","转板集中并伴随轨迹急变","{入弯／弯中／弯尾}突然猛转板，轨迹跟着折了一下"],["平板时转板","平板时转板：在接近平板姿态时转动板向，再进入另一侧","接近平板姿态时转板","换刃时先把雪板放平转过去，再立下个刃"]],"转速":[["实测值","实测值：写板向转动的速率与连续程度（例：一弯约2.4秒转过约155度，平均约65度／秒，过程连续）","实际转板快慢和连续程度","一个弯约{实测}秒转过约{实测}度，平均每秒转约{实测}度"]],"外摆":[["跟随","跟随：跟随端沿领滑端路径通过，没有可分辨的外摆","—","板尾跟着板头的轨迹走，没有往外甩"],["渐进外摆","渐进外摆：跟随端随弯阶段渐进向弧外偏离，搓滑分布连续","跟在后面的板端外摆","板尾逐渐往弯外扫，搓雪均匀连贯"],["甩板尾","甩板尾：跟随端在某段突然向弧外摆出，同时路线急变或滑移集中（写阶段，例：弯尾）","跟在后面的板端外摆","{入弯／弯中／弯尾}板尾突然往弯外甩出去，搓雪集中在这一下"]],"侧移":[["平稳","平稳：已测板上位置的侧向移动平稳","—","雪板横向搓动平稳，没有突然变多"],["突增","突增：某段侧向移动突然增多（写阶段，例：弯尾）","侧向移动突然增加","{入弯／弯中／弯尾}雪板横向搓动突然变多"]],"旋转":[["同向转动","同向转动：上下身主要同向转动（幅度或时机可不同），板向随之持续改变","上下身主要同向转动","上半身和下半身朝同一个方向转，雪板随之持续转向"],["上稳下转","上稳下转：上身朝向较稳定，下肢与雪板完成主要转向","上身较稳、下肢转板","上半身朝向基本不动，主要是腿和雪板在转"],["反向转动","反向转动：某时窗胸廓与下肢实际反向转动（写时窗，例：转换附近）","上下身实际反向转动","{换刃时／入弯／弯中／弯尾}上半身和下半身朝相反方向转（反拧）"]],"两侧":[["接近","接近：两侧板向与轨迹关系、转板速率与分布、跟随端外摆和节段旋转都接近","—","前后刃弯的转板方式差不多"],["板向与轨迹关系不同","板向与轨迹关系不同：两侧板向改变相对轨迹改变的先后或差值不同（例：后刃板向先变、轨迹后变的间隔比前刃更大）","前后刃板向与轨迹关系不同","前后刃板头领先的程度不一样：前刃弯板头方向和滑行方向夹角约{实测}度，后刃弯约{实测}度"],["转板速率与分布不同","转板速率与分布不同：两侧板向转速或转板集中的阶段不同（例：后刃转板集中在弧尾，前刃分布较连续）","前后刃转板速率与分布不同","前后刃转板不一样：前刃弯{均匀转板／集中在入弯／集中在弯尾}，平均每秒约{实测}度；后刃弯{均匀转板／集中在入弯／集中在弯尾}，平均每秒约{实测}度"],["跟随端外摆不同","跟随端外摆不同：两侧跟随端外偏的幅度、持续或阶段不同（例：后刃弯尾跟随端突然外偏，前刃外偏较小且渐进）","前后刃跟随端外摆不同","前后刃板尾外扫不一样：前刃弯{没有外甩／逐渐外扫／突然甩板尾}，后刃弯{没有外甩／逐渐外扫／突然甩板尾}"],["节段旋转不同（暂不能识别）","节段旋转不同（暂不能识别）：两侧胸廓、骨盆、下肢与板向的相对运动不同（例：前刃上身较稳、下肢转动，后刃胸廓转动更明显）","前后刃节段旋转配合不同","前后刃上下半身的配合不一样：前刃弯{同向转／上半身不动腿转／反拧}，后刃弯{同向转／上半身不动腿转／反拧}"]]}},{"name":"时机、节奏与协调","head":"6. 时机、节奏与协调（4句，15个现象）","sents":[["节奏",["周期","快慢","转换占比"],"【周期】；【快慢】；【转换占比】。"],["屈伸",["屈伸"],"【屈伸】。（暂不能识别）"],["重复",["同侧","跨片段"],"【同侧】。**变化：**【跨片段】。"],["两侧",["两侧"],"【两侧】。"]],"vals":{"周期":[["接近","接近：连续单弯或成对弯用时接近（例：单弯都在约2.3–2.5秒）","连续弯用时接近","每个弯用时差不多，都在约{实测}秒"],["规律变化","规律变化：周期沿连续弯有规律地变化（例：由约2.4秒逐渐缩短到约1.6秒，转向幅度随之减小）","节奏有规律地变化","每个弯用时逐渐{变短／变长}，从约{实测}秒到约{实测}秒"],["无规律","无规律：用时无规律地反复变化（例：单弯交替出现约1.4秒与约2.0秒）","连续弯用时反复变化","每个弯用时忽长忽短，在约{实测}秒到约{实测}秒之间变化"]],"快慢":[["实测值","实测值：写单弯周期与每弯转向幅度（例：单弯约1.4秒、转过约120度；或约2.0秒、转过约150度）","实际节奏快慢与转向幅度","一个弯约{实测}秒，转过约{实测}度"]],"转换占比":[["与参照接近","与参照接近：完整转换（从退出侧旧刃开始释放到进入侧新刃建立，按转换方向分别写）历时占单弯周期的比例与参照接近，参照用另一个转换方向、同侧其他弯或前一片段；写出历时和比例（例：两个方向都约0.5秒、约占20%）。弯尾近直区间不计入，写在维度1“弯形”句的“弯尾”槽","—","换刃用时约{实测}秒，约占一个弯的{实测}%，和{另一个换刃方向／同侧其他弯／前一段滑行}差不多"],["明显大于参照","明显大于参照：完整转换占单弯周期的比例明显大于参照，写出参照和差值（例：退出前刃→进入后刃约0.8秒、约占33%，反方向约0.5秒、约占20%）","转换区间占比较大","{前刃换后刃／后刃换前刃}用了约{实测}秒，约占一个弯的{实测}%，比{另一个换刃方向／同侧其他弯／前一段滑行}多约{实测}秒"]],"屈伸":[["引伸换刃","引伸换刃：释放旧弯并转换时下肢伸展，进入新弯后逐渐屈曲","伸展换刃相容动作","换刃时起身伸腿，进入下一个弯后逐渐弯腿"],["屈腿换刃","屈腿换刃：旧刃释放时下肢屈曲、较屈曲地翻板，新刃建立后逐渐伸展","屈腿换刃相容动作","换刃时弯腿压低（团身），立下个刃后逐渐伸腿"],["回收换刃","回收换刃：头与躯干高度变化小，腿板相对身体明显回收并快速跨侧","回收换刃相容动作","换刃时上半身高度基本不变，腿和雪板快速收到身体下方再翻到另一侧"]],"同侧":[["接近","接近：同一侧多次弯的被比较过程接近（例：多次前刃弯的刃角曲线接近；后刃另行比较）","同一侧多次过程接近","同一侧的每个弯都差不多（前刃弯之间比，后刃弯之间比）"],["差别较大","差别较大：同一侧多次弯差别较大（例：多次后刃弯有的连续成弧，有的前直后急）","同一侧多次过程差别较大","{前刃／后刃}弯每次滑出来都不太一样，{实测}个弯里有{实测}个差别明显"],["少数偏离","少数偏离：同一侧多数弯接近、少数明显偏离（写偏离的是哪几弯）","同一侧多次过程接近、同一侧多次过程差别较大","{前刃／后刃}弯大多数差不多，只有第{实测}个弯明显不一样"]],"跨片段":[["无变化","无变化：与相似条件的前一片段相比没有可分辨的变化","—","和前一段滑行相比没有明显变化"],["有变化","有变化：与相似条件的前一片段相比有变化（写哪一项、方向与幅度，例：弧尾近直区间比基线缩短约0.2秒）","相似条件下前后片段表现改变","和前一段滑行相比，{哪一项}{变大／变小／变长／变短}了约{实测}（带单位）"]],"两侧":[["接近","接近：两侧周期与衔接、屈伸模式、各自重复程度和跨片段变化都接近","—","前后刃弯的节奏差不多"],["周期或衔接不同","周期或衔接不同：两侧单弯周期或完整转换历时不同（例：前刃一弯约2.0秒、后刃约1.4秒；或退出前刃→进入后刃的完整转换约0.8秒、反方向约0.5秒）；两侧弯尾近直横切的差别写在维度1“两侧”句","前后刃周期或衔接不同","前后刃节奏不一样：前刃弯约{实测}秒，后刃弯约{实测}秒；前刃换后刃约{实测}秒，后刃换前刃约{实测}秒"],["屈伸模式不同（暂不能识别）","屈伸模式不同（暂不能识别）：两侧关节过程或换刃模式不同（例：进入前刃主要为伸展序列，进入后刃主要为屈曲序列）","前后刃屈伸及换刃模式不同","前后刃换刃时的屈伸方式不一样：换到前刃{起身伸腿／弯腿团身／回收}，换到后刃{起身伸腿／弯腿团身／回收}"],["重复程度不同","重复程度不同：两侧各自多次弯的离散程度不同（例：前刃多次建刃时机相近，后刃每次变化较大）","前后刃各自重复程度不同","{前刃／后刃}弯每次都差不多，{前刃／后刃}弯每次不太一样"],["跨片段变化不同","跨片段变化不同：相似条件下两侧相对前一片段的变化不同（例：后续片段后刃弧尾横切缩短约0.2秒，前刃保持不变）","前后刃跨片段变化不同","和前一段滑行相比，前后刃的变化不一样：前刃弯{哪一项}变化约{实测}，后刃弯变化约{实测}"]]}}],"runs":[["a1","滑手 A（反脚）· 8 月 14 日 第 1 趟"],["a2","滑手 A（反脚）· 8 月 14 日 第 2 趟"],["a3","滑手 A（反脚）· 8 月 14 日 第 3 趟"],["b1","Kin（正脚）· 8 月 21 日 第 1 趟"],["b2","Kin（正脚）· 8 月 21 日 第 2 趟"],["b3","Kin（正脚）· 8 月 21 日 第 3 趟"],["c1","李杨（反脚）· 6 月 30 日 第 1 趟"],["c2","李杨（反脚）· 6 月 30 日 第 2 趟"],["c3","李杨（反脚）· 6 月 30 日 第 3 趟"],["d1","周占双（正脚）· 7 月 7 日 第 5 趟"],["e1","Allen（反脚）· 6 月 16 日 第 1 趟"],["e2","Vanessa（反脚）· 7 月 28 日 第 1 趟"],["e3","小白（反脚）· 7 月 28 日 第 4 趟"],["e4","Will（正脚）· 7 月 29 日  document.getElementById('stat').textContent=(ST.scope==='all'?D.runs.length+' 趟 · ':'')+turns.length+' 个弯'+(ST.conds.length?'（满足下面全部筛选条件）':'');
 document.getElementById('tabs').innerHTML=DIMS.map((x,j)=>'<button data-d="'+j+'" class="'+(j===ST.dim?'on':'')+'">'+esc(x.name)+'</button>').join('');
 document.getElementById('conds').innerHTML=ST.conds.length?'<span class="lb">同时满足：</span>'+ST.conds.map((c,j)=>'<span class="cond">'+esc(c.dn+' · '+c.sl+' = '+c.v)+'<button data-rm="'+j+'">×</button></span>').join('')+'<span class="cond" style="background:#fff;border-color:var(--line)"><button data-rm="all" style="color:var(--blue)">清空</button></span>':'';
 const runs=ST.scope==='all'?D.runs.map(([k])=>k):[ST.scope];
 const one=ST.scope!=='all';
 let h='';
 d.sents.forEach(([sn,slots])=>{
  const grp=[[sn,[]]];slots.forEach(sl=>{if(sl==='滑法')grp.push(['滑法',[]]);grp[grp.length-1][1].push(sl)});
  grp.forEach(([gn,sls])=>{if(!sls.length)return;let gh='';
   sls.forEach(sl=>{const isRun=!!RUNSLOT[sl];const key=sl==='两侧'?'两侧'+(d.i+1):sl;const tbl=d.vals[sl]||[];const defOf=n=>{const r=tbl.find(x=>x[0]===n);return r?r[1]:''};
    const B={};
    if(isRun){runs.forEach(k=>{const v=(RUN[k]||{})[key];const names=!v?['?']:(v[0]==='?'||v[0]==='!')?[v[0]]:split(v[0]);names.forEach(n=>(B[n]=B[n]||[]).push({k,mea:v&&v[1],out:v&&v[2]}))})}
    else turns.forEach(t=>vals(t,sl).forEach(n=>(B[n]=B[n]||[]).push(t)));
    const names=Object.keys(B);const total=isRun?runs.length:turns.length;
    const title='<h3>'+esc(sl)+(isRun?' <span class="rn">整趟</span><small>要看连续多弯才能定，按趟归类，点趟名切到这一趟</small>':'')+'</h3>';
    if(names.length&&names.every(n=>n==='!')){gh+='<div class="slot">'+title+'<div class="note">文档标暂不能识别，没有结论可归类。</div></div>';return}
    if(names.length&&names.every(n=>n==='?')){gh+='<div class="slot">'+title+'<div class="note">暂无法描述（'+esc(((isRun?B['?'][0].mea:(B['?'][0].S[sl]||[])[1])||'缺少记录'))+'），没有结论可归类。</div></div>';return}
    if(names.length&&names.every(n=>n==='实测值'||n==='?')){gh+='<div class="slot">'+title+'<div class="note">逐弯写的是实测数值（不分档），没有结论可归类；数值见各弯卡片。</div></div>';return}
    const order=[...tbl.map(r=>r[0]).filter(n=>B[n]),...names.filter(n=>!tbl.some(r=>r[0]===n)&&n!=='?'&&n!=='!'),...['?','!'].filter(n=>B[n])];
    gh+='<div class="slot">'+title+order.map(n=>bucket(sl,n,defOf(n),B[n],total,isRun,(one||isRun)&&n!=='?'&&n!=='!')).join('')+'</div>'});
   if(gh)h+='<div class="grp"><h2>'+esc(gn)+'</h2>'+gh+'</div>'})});
 document.getElementById('main').innerHTML=h||'<div class="load">没有符合条件的弯</div>';
}
function setScope(k){ST.scope=RL[k]?k:'all';scopeSel.value=ST.scope;history.replaceState(null,'','#'+(ST.scope==='all'?'':ST.scope));render();scrollTo(0,0)}
scopeSel.onchange=()=>setScope(scopeSel.value);
['edge','glide'].forEach(id=>document.getElementById(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;ST[id]=b.dataset.v;document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('on',x===b));render()});
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;ST.dim=+b.dataset.d;try{localStorage.setItem('cgd',ST.dim)}catch(_){}render()};
document.getElementById('conds').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.rm==='all')ST.conds=[];else ST.conds.splice(+b.dataset.rm,1);render()};
document.getElementById('main').onclick=e=>{
 const fb=e.target.closest('.fb');if(fb){e.preventDefault();const sl=fb.dataset.sl,v=fb.dataset.v;const j=ST.conds.findIndex(c=>c.sl===sl&&c.v===v);if(j>=0)ST.conds.splice(j,1);else ST.conds.push({sl,v,dn:DIMS[ST.dim].name});render();return}
 const sc=e.target.closest('[data-scope]');if(sc){e.preventDefault();setScope(sc.dataset.scope);return}
 const tc=e.target.closest('.tc[data-t]');if(tc){const sl=tc.closest('.slot').querySelector('h3').firstChild.textContent;const v=tc.closest('details').querySelector('.vn').textContent;openTurn(tc.dataset.t,sl,v,[...tc.closest('.body').querySelectorAll('.tc[data-t]')].map(x=>x.dataset.t))}};
const mask=document.getElementById('mask'),dlg=document.getElementById('dlg');
function closeDlg(){mask.hidden=true;dlg.innerHTML=''}
mask.onclick=e=>{if(e.target===mask||e.target.closest('.x'))closeDlg();const b=e.target.closest('[data-go]');if(b){const c=JSON.parse(mask.dataset.ctx);openTurn(b.dataset.go,c.sl,c.v,c.list)}};
addEventListener('keydown',e=>{if(mask.hidden)return;if(e.key==='Escape')closeDlg();const c=JSON.parse(mask.dataset.ctx||'{}');if(!c.list)return;const j=c.list.indexOf(c.id);
 if(e.key==='ArrowRight'&&j<c.list.length-1)openTurn(c.list[j+1],c.sl,c.v,c.list);if(e.key==='ArrowLeft'&&j>0)openTurn(c.list[j-1],c.sl,c.v,c.list)});
function crow(d,sl,S,cur){const isRun=!!RUNSLOT[sl];const key=sl==='两侧'?'两侧'+(d.i+1):sl;const v=isRun?null:S[sl];
 let c;if(isRun)c='<span class="rn">整趟</span>';else if(!v)c='<span class="note">暂无法描述</span>';else if(v[0]==='!')c='<span class="note">暂不能识别</span>';else if(v[0]==='?')c='<span class="note">暂无法描述（缺少：'+esc(v[1])+'）</span>';
 else c='<b>'+esc(v[0])+'</b>'+(v[2]?'：'+esc(v[2]):'')+(v[1]?'<span class="mea">（依据：'+esc(v[1])+'）</span>':'');
 return '<div class="crow'+(cur?' cur':'')+'"><span class="sl">'+esc(sl)+'</span><span>'+c+'</span></div>'}
function openTurn(id,sl,v,list){const t=TURNS.find(x=>x.id===id);if(!t)return;const h=hdr(t);const d=DIMS[ST.dim];
 mask.dataset.ctx=JSON.stringify({id,sl,v,list});const j=list.indexOf(id);
 const vid=h[3]?'<video src="'+ORIG+t.r+'/t'+String(t.k).padStart(2,'0')+'.mp4" muted playsinline loop autoplay controls></video>':'<div class="note">这一弯没有视频片段</div>';
 let rows='';d.sents.forEach(([sn,slots])=>{rows+='<div class="sn">'+esc(sn)+'</div>'+slots.map(s=>crow(d,s,t.S,s===sl)).join('')});
 dlg.innerHTML='<button class="x">×</button><h4>'+esc(RL[t.r])+' · T'+t.k+(h[0]?' · '+h[0]:'')+(h[1]?' · '+h[1]:'')+(h[2]?' · '+h[2]:'')+'</h4>'
 +'<div class="hit">'+esc(d.name)+' · '+esc(sl)+' = <b>'+esc(v)+'</b>（这一组第 '+(j+1)+' / '+list.length+' 个弯）</div>'
 +'<div class="dg"><div>'+vid+'<div class="nav">'+(j>0?'<button data-go="'+list[j-1]+'">← 上一个</button>':'')+(j<list.length-1?'<button data-go="'+list[j+1]+'">下一个 →</button>':'')+'<a href="'+ORIG+'#'+t.r+'-t'+t.k+'" target="_blank" rel="noopener">在逐弯页打开这张卡片 ↗</a></div>'+(h[4]?'<div class="note" style="margin-top:6px">甩板尾：'+esc(h[4])+'</div>':'')+'</div><div>'+rows+'</div></div>';
 mask.hidden=false}
(async()=>{
 const ks=D.runs.map(([k])=>k);let done=0;const ld=document.getElementById('load');
 const js=await Promise.all(ks.map(k=>fetch(ORIG+k+'/c4.json?t='+Math.floor(Date.now()/600000),{cache:'no-cache'}).then(x=>x.json()).catch(()=>null).finally(()=>{done++;ld.textContent='正在读取各趟结论… '+done+' / '+ks.length})));
 const bad=[];ks.forEach((k,i)=>{const J=js[i];if(!J){bad.push(k);return}RUN[k]=J.run;Object.entries(J.turns).sort((a,b)=>a[0]-b[0]).forEach(([n,S])=>TURNS.push({id:k+'-'+n,r:k,k:n,S}))});
 const s=+localStorage.getItem('cgd');if(s>0&&s<DIMS.length)ST.dim=s;
 const h0=location.hash.slice(1);if(RL[h0]){ST.scope=h0;scopeSel.value=h0}
 render();if(bad.length)document.getElementById('main').insertAdjacentHTML('afterbegin','<div class="note">有 '+bad.length+' 趟没读到：'+bad.join('、')+'</div>');
})();
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(RL[h]&&h!==ST.scope)setScope(h)});
</script></body></html>
